const ray=new THREE.Raycaster();ray.far=5.2;function aimed(){if(thirdPerson){ray.set(new THREE.Vector3(px,1.8,pz),new THREE.Vector3(-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch)).normalize())}else{ray.setFromCamera(new THREE.Vector2(0,0),camera)}let best=null,dist=5.2;for(const t of trees.values()){if(Math.hypot(t.position.x-px,t.position.z-pz)>6)continue;const hits=ray.intersectObjects(t.children.filter(c=>c!==t.userData.scar),false);if(hits.length&&hits[0].distance<dist){best=t;dist=hits[0].distance}}return best}
const chipGeo=new THREE.BoxGeometry(.1,.1,.1),chipMat=new THREE.MeshLambertMaterial({color:0xc59560});function spawnChips(t){for(let i=0;i<7;i++){const mesh=new THREE.Mesh(chipGeo,chipMat);mesh.position.set(t.position.x+(Math.random()-.5)*.7,1.15+Math.random()*.5,t.position.z+(Math.random()-.5)*.7);scene.add(mesh);particles.push({mesh,vx:(Math.random()-.5)*3,vy:1+Math.random()*3,vz:(Math.random()-.5)*3,life:.7})}}
function chop(){if(buildMode){placeLog();return}const now=performance.now();const chopCooldown=(ownAvatar?.actions?.Chop2?.getClip().duration??(1.4166666666666667))/CHOP_SPEED*1000+35;if(now-lastHit<chopCooldown)return;lastHit=now;swing=1;actorChop(ownAvatar);const t=aimed();if(!t)return;const u=t.userData;if(isOnline()){sendNet({type:"hit",tree:u.id});return;}u.hp--;u.scar.visible=true;u.scar.scale.y=1+(1-u.hp/u.maxHp)*2.2;spawnChips(t);t.rotation.z=(Math.random()-.5)*.045;
if(u.hp<=0){trees.delete(u.id);felled.add(u.id);falling.push({tree:t,elapsed:0,direction:Math.atan2(px-u.x,pz-u.z)+Math.PI,removed:false});wood+=5;cuts++;$('wood').textContent=wood;$('cut').textContent=cuts;$('target').textContent='+5 🪵 Древесина';setTimeout(()=>{if($('target').textContent.includes('+5'))$('target').textContent=''},900)}}

const isTypingTarget=el=>el instanceof Element&&!!el.closest('input, textarea, select, [contenteditable="true"], [role="textbox"]');document.addEventListener('focusin',e=>{if(isTypingTarget(e.target)){for(const code in keys)keys[code]=false}});document.addEventListener('keydown',e=>{if(isTypingTarget(e.target)||isTypingTarget(document.activeElement))return;if(e.code==='Space'){e.preventDefault();if(!e.repeat)requestJump();return}if(e.code==='KeyV'){toggleView();return}if(e.code==='KeyB'){setMode(!buildMode);return}if(e.code==='KeyR'&&buildMode){orientation=1-orientation;return}if(e.code==='KeyE'&&buildMode){placeLog();return}if(e.code==='KeyQ'&&buildMode){removeLog();return}if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight'].includes(e.code)){keys[e.code]=true;e.preventDefault()}});document.addEventListener('keyup',e=>{keys[e.code]=false});window.addEventListener('blur',()=>{for(const code in keys)keys[code]=false});$('jump').addEventListener('pointerdown',e=>{e.preventDefault();requestJump()});$('hit').addEventListener('pointerdown',e=>{e.preventDefault();chop()});const stick=$('stick'),knob=$('knob');let joyId=null;function joy(e){const r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,len=Math.max(1,Math.hypot(dx,dy)),factor=Math.min(1,48/len);joyX=dx*factor/48;joyY=dy*factor/48;knob.style.transform=`translate(${joyX*40}px,${joyY*40}px)`}stick.addEventListener('pointerdown',e=>{e.preventDefault();joyId=e.pointerId;stick.setPointerCapture(e.pointerId);joy(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joy(e)});function stopJoy(){joyId=null;joyX=joyY=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',stopJoy);stick.addEventListener('pointercancel',stopJoy);
$('reset').onclick=()=>{if(isOnline()){alert('В сетевой игре мир общий и сохраняется на сервере.');return;}for(const t of trees.values())scene.remove(t);for(const g of chunks.values())scene.remove(g);for(const f of falling)scene.remove(f.tree);for(const p of particles)scene.remove(p.mesh);for(const p of placed)scene.remove(p.mesh);placed.length=0;if(preview){scene.remove(preview);preview=null}trees.clear();chunks.clear();falling.length=0;particles.length=0;felled.clear();seed=(Math.random()*999999)|0;px=pz=yaw=pitch=wood=cuts=0;feetY=verticalSpeed=0;onGround=true;$('wood').textContent='0';$('cut').textContent='0';updateChunks()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});if(matchMedia('(pointer:coarse)').matches)$('instructions').innerHTML='Джойстик — ходить · ⬆️ прыжок<br>Свайп — обзор<br>Строительство — справа<br>👤 — сменить камеру';else $('instructions').innerHTML='WASD — ходить · Shift — бег · Space — прыжок<br>Мышь — обзор<br>B — стройка · E — положить<br>R — повернуть · Q — убрать<br>V — сменить камеру';loading.remove();updateChunks();

// Multiplayer: authoritative server state, client-side rendering.
let socket=null,myId=null,lastMoveSent=0;const avatars=new Map();
ownAvatar=createLumberjack();if(ownAvatar){scene.add(ownAvatar.group);ownAvatar.group.visible=thirdPerson;}
function toggleView(){thirdPerson=!thirdPerson;if(ownAvatar)ownAvatar.group.visible=thirdPerson;axe.visible=!thirdPerson;$('viewtoggle').textContent=thirdPerson?'👤 Камера: сзади':'👁 Камера: глаза'}
$('viewtoggle').onclick=toggleView;axe.visible=false;
function isOnline(){return socket?.readyState===WebSocket.OPEN&&myId!==null}
function sendNet(data){if(isOnline())socket.send(JSON.stringify(data))}
function syncWood(w,c){wood=w;$('wood').textContent=wood;if(c!==undefined){cuts=c;$('cut').textContent=cuts}}
function clearWorld(){for(const t of trees.values())scene.remove(t);for(const g of chunks.values())scene.remove(g);for(const f of falling)scene.remove(f.tree);for(const p of particles)scene.remove(p.mesh);for(const p of placed)scene.remove(p.mesh);if(preview){scene.remove(preview);preview=null}trees.clear();chunks.clear();falling.length=0;particles.length=0;placed.length=0;felled.clear();treeDamage.clear()}
function addLog(data){if(placed.some(p=>p.id===data.id))return;const m=makeLog();m.position.set(data.x,data.y,data.z);if(data.orientation===1)m.rotation.y=Math.PI/2;scene.add(m);placed.push({...data,mesh:m})}
function treeHit(id,hp){treeDamage.set(id,hp);const t=trees.get(id);if(t){t.userData.hp=hp;t.userData.scar.visible=true;t.userData.scar.scale.y=1+(1-hp/t.userData.maxHp)*2.2;spawnChips(t)}}
function treeFell(id){felled.add(id);treeDamage.delete(id);const t=trees.get(id);if(t){trees.delete(id);falling.push({tree:t,elapsed:0,direction:Math.random()*Math.PI*2})}}
function addAvatar(p){if(p.id===myId||avatars.has(p.id))return;
 const actor=createLumberjack();const group=actor?actor.group:new THREE.Group();
 if(!actor){const mesh=new THREE.Mesh(new THREE.CapsuleGeometry(.34,1.1,4,8),new THREE.MeshLambertMaterial({color:0x557d96}));mesh.position.y=1.0;group.add(mesh)}
 group.position.set(p.x,p.y||0,p.z);scene.add(group);
 avatars.set(p.id,{group,actor,goal:new THREE.Vector3(p.x,p.y||0,p.z),angle:p.yaw||0,jumping:!!p.jumping});}

function removeAvatar(id){const a=avatars.get(id);if(a){scene.remove(a.group);if(a.actor){a.actor.mixer.stopAllAction();modelActors.delete(a.actor)}avatars.delete(id)}}
function closeNet(){if(socket){const old=socket;socket=null;old.onclose=null;old.close()}myId=null;for(const id of [...avatars.keys()])removeAvatar(id);$('online').textContent='⚪ Одиночная игра';$('netstatus').textContent='Отключено. Локальный мир можно продолжить.';$('reset').disabled=false}
$('nettoggle').onclick=()=>{$('network').style.display=$('network').style.display==='none'?'block':'none'};
$('disconnect').onclick=closeNet;
$('connect').onclick=()=>{closeNet();let url=$('neturl').value.trim();if(url.startsWith('https://'))url='wss://'+url.slice(8);else if(url.startsWith('http://'))url='ws://'+url.slice(7);if(!/^wss?:\/\//.test(url))url='ws://'+url;try{socket=new WebSocket(url)}catch(e){$('netstatus').textContent='Ошибка адреса: '+e.message;return}const ws=socket;$('netstatus').textContent='Подключаемся...';ws.onopen=()=>{ws.send(JSON.stringify({type:'hello',name:$('netname').value}))};ws.onerror=()=>{$('netstatus').textContent='Не удалось подключиться. Проверьте адрес, порт и firewall.'};ws.onclose=()=>{if(socket===ws){closeNet();$('netstatus').textContent='Соединение потеряно. Переподключитесь.'}};ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}switch(d.type){case 'welcome':myId=d.id;clearWorld();seed=d.seed;for(const id of d.felled)felled.add(id);for(const [id,hp] of Object.entries(d.damage||{}))treeDamage.set(id,hp);for(const log of d.logs)addLog(log);for(const p of d.players)addAvatar(p);px=pz=0;feetY=verticalSpeed=0;onGround=true;syncWood(d.wood,d.cuts);updateChunks();$('online').textContent='🟢 Онлайн · '+(d.players.length+1)+' игроков';$('netstatus').textContent='Подключено! Мир общий и сохраняется на сервере.';break;case 'join':addAvatar(d.player);$('online').textContent='🟢 Онлайн · '+(avatars.size+1)+' игроков';break;case 'leave':removeAvatar(d.id);$('online').textContent='🟢 Онлайн · '+(avatars.size+1)+' игроков';break;case 'move':{const a=avatars.get(d.id);if(a){a.goal.set(d.x,d.y||0,d.z);a.angle=d.yaw;a.jumping=!!d.jumping}break}case 'tree_hit':treeHit(d.tree,d.hp);for(const a of avatars.values()){if(Math.hypot(a.group.position.x-(trees.get(d.tree)?.position.x??9999),a.group.position.z-(trees.get(d.tree)?.position.z??9999))<5)actorChop(a.actor)}break;case 'tree_fell':treeFell(d.tree);if(d.by===myId){syncWood(d.wood,d.cuts);$('target').textContent='+5 🪵 Древесина'}break;case 'log_add':addLog(d.log);if(d.by===myId)syncWood(d.wood);break;case 'log_remove':{const i=p function animate(now){

 const dt=Math.min(.05,(now-lastTime)/1000);lastTime=now;
 let forward=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joyY;
 let side=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joyX;
 const len=Math.max(1,Math.hypot(forward,side));forward/=len;side/=len;
 const sprint=!!(keys.ShiftLeft||keys.ShiftRight);
 const moving=Math.hypot(forward,side)>.1;
 const motion=!moving?'Idle':Math.abs(forward)>.1?(sprint?'Run':'Walk'):(side<0?'StrafeLeft':'StrafeRight');
 // Playback rate also scales Root Motion distance: faster feet = faster travel.
 const rate=motion==='Idle'?1:(motion==='StrafeLeft'||motion==='StrafeRight')?(sprint?5:4):(motion==='Run'?(forward<0?-2.35:2.35):(forward<0?-2.25:2.25));

 let dx=0,dz=0;
 if(ownAvatar){
  ownAvatar.group.rotation.y=yaw;
  const rootDelta=tickActor(ownAvatar,dt,motion,!onGround,rate);
  dx=rootDelta.x;dz=rootDelta.z;
  // Diagonal input keeps its intended direction; step distance still comes
  // from the animation, rather than an independent hard-coded speed.
  if(onGround&&Math.abs(forward)>.1&&Math.abs(side)>.1){
   const distance=Math.hypot(dx,dz);
   dx=(-Math.sin(yaw)*forward+Math.cos(yaw)*side)*distance;
   dz=(-Math.cos(yaw)*forward-Math.sin(yaw)*side)*distance;
  }
 }
 // Jump movement remains physics/input-driven, not extracted from Root.
 // Also keep a fallback when testing against an old GLB without Root Motion.
 const noRoot=motion!=='Idle'&&(!rootMotion[motion]||rootMotion[motion].travel.lengthSq()<1e-5);
 if(!onGround||!ownAvatar||noRoot){
  const speed=sprint?4.6:2.5;
  dx=(-Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed*dt;
  dz=(-Math.cos(yaw)*forward-Math.sin(yaw)*side)*speed*dt;
 }
 moveHorizontal(dx,dz);
 if(ownAvatar)ownAvatar.group.position.set(px,feetY,pz);
 camera.position.set(px,feetY+1.8+Math.sin(now*.011)*Math.min(1,Math.hypot(forward,side))*.035,pz);camera.rotation.set(pitch,yaw,0);

  camera.position.set(px+Math.sin(yaw)*back,feetY+1.8+raise+Math.max(0,-Math.sin(pitch))*1.5,pz+Math.cos(yaw)*back);

for(let i=falling.length-1;i>=0;i--){const f=falling[i];f.elapsed+=dt;const a=Math.min(1,f.elapsed/1.8);const angle=a*a*(Math.PI/2);f.tree.rotation.z=Math.sin(f.direction)*angle;f.tree.rotation.x=Math.cos(f.direction)*angle;if(f.elapsed>2.5){scene.remove(f.tree);falling.splice(i,1)}}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.vy-=9.8*dt;p.mesh.position.x+=p.vx*dt;p.mesh.position.y+=p.vy*dt;p.mesh.position.z+=p.vz*dt;p.mesh.rotation.x+=dt*8;if(p.life<=0||p.mesh.position.y<0){scene.remove(p.mesh);particles.splice(i,1)}}
if(frame++%12===0){updateChunks();updatePreview();const t=buildMode?null:aimed();$('damage').style.display=t?'block':'none';if(t){const u=t.userData;$('target').textContent=`🌲 Дерево · ${u.hp}/${u.maxHp} ударов`;$('damagebar').style.width=(u.hp/u.maxHp*100)+'%'}else if(!$('target').textContent.includes('+5'))$('target').textContent=buildMode?'🪵 Прицел — место установки':''}if(isOnline()&&now-lastMoveSent>100){lastMoveSent=now;sendNet({type:'move',x:px,z:pz,y:feetY,yaw,jumping:!onGround})}for(const avatar of avatars.values()){avatar.group.position.lerp(avatar.goal,Math.min(1,dt*10));avatar.group.rotation.y+=Math.atan2(Math.sin(avatar.angle-avatar.group.rotation.y),Math.cos(avatar.angle-avatar.group.rotation.y))*Math.min(1,dt*8);

   const vx=avatar.goal.x-avatar.group.position.x,vz=avatar.goal.z-avatar.group.position.z;
   const a=avatar.group.rotation.y,front=-Math.sin(a)*vx-Math.cos(a)*vz,right=Math.cos(a)*vx-Math.sin(a)*vz;
