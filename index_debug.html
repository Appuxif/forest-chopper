<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Forest Chopper 3D — DEBUG</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10241c;font-family:system-ui;color:white;touch-action:none}#game{position:fixed;inset:0}canvas{display:block;touch-action:none}.hud{position:absolute;z-index:2;pointer-events:none;text-shadow:0 2px 5px #000}.top{top:16px;left:16px;font-size:15px}.top strong{font-size:19px}.instructions{right:15px;top:18px;text-align:right;font-size:12px}.cross{left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;color:#fffd}.target{bottom:130px;left:50%;transform:translateX(-50%);font-size:14px;white-space:nowrap;text-align:center}.control{position:absolute;z-index:5;touch-action:none;user-select:none}#stick{bottom:28px;left:25px;width:130px;height:130px;border-radius:50%;background:#ffffff22;border:1px solid #ffffff66}#knob{position:absolute;left:41px;top:41px;width:48px;height:48px;border-radius:50%;background:#ffffff66;border:1px solid #ffffff88;pointer-events:none}button{color:white;border:1px solid #ffffff66;background:#0006;cursor:pointer}#jump{right:120px;bottom:54px;width:62px;height:62px;border-radius:50%;font-size:28px;background:#203e36cb}#hit{right:26px;bottom:38px;width:85px;height:85px;border-radius:50%;font-size:35px}#reset{top:16px;right:16px;border-radius:9px;padding:9px 12px;font-size:12px}#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#10241c;z-index:20;text-align:center}#load b{font-size:24px}#load span{opacity:.7;font-size:14px}#damage{position:absolute;top:70px;left:50%;transform:translateX(-50%);width:150px;height:9px;border-radius:8px;background:#0008;display:none;overflow:hidden;z-index:3}#buildbar{position:absolute;z-index:6;bottom:145px;right:14px;display:flex;flex-direction:column;gap:7px;align-items:end}#buildbar button{border-radius:10px;padding:10px 13px;font-size:14px;background:#162a20dc}#buildbar button.active{background:#4d7945}#buildbar .small{font-size:11px;max-width:180px;text-align:right;color:#fff}#damagebar{height:100%;background:#edb35b;width:100%;transition:width .15s}
#network{position:absolute;z-index:12;top:58px;right:12px;background:#10251fe8;border:1px solid #ffffff44;border-radius:12px;padding:10px;width:min(310px,calc(100vw - 24px));font-size:12px}#network input:not([type="checkbox"]),#network select{width:100%;margin:4px 0 7px;padding:9px;border-radius:7px;border:1px solid #ffffff55;background:#07150f;color:white;font-size:13px}#network button{border-radius:7px;padding:7px 12px}#network small{display:block;margin-top:5px;opacity:.8}#nettoggle{position:absolute;top:16px;right:155px;z-index:10;border-radius:9px;padding:9px;font-size:12px}#online{margin-top:4px;color:#a6efbf;font-size:12px}
</style></head><body><div id="game"><div class="hud top"><strong>🌲 FOREST CHOPPER</strong><div>🪵 Древесина: <b id="wood">0</b></div><div>🌳 Срублено: <b id="cut">0</b></div></div><div id="online" class="hud" style="top:85px;left:16px">⚪ Одиночная игра</div><div class="hud instructions" id="instructions">WASD — ходить<br>Мышь — обзор<br>Клик — рубить</div><div class="hud cross">+</div><div class="hud target" id="target"></div><div id="damage"><div id="damagebar"></div></div><div id="stick" class="control"><div id="knob"></div></div><button id="jump" class="control" aria-label="Прыжок">⬆️</button><button id="hit" class="control" aria-label="Рубить">🪓</button><div id="buildbar"><button id="mode">🏗️ Строить</button><button id="rotate" style="display:none">↻ Повернуть (R)</button><button id="place" style="display:none">🪵 Положить (E)</button><button id="undo" style="display:none">↶ Убрать (Q)</button><div id="buildhint" class="small"></div></div><button id="viewtoggle" style="position:absolute;top:55px;right:155px;z-index:10;border-radius:9px;padding:9px;font-size:12px">👤 Камера: сзади</button><button id="nettoggle">🌐 Онлайн</button><div id="network" style="display:none"><b>🌐 Multiplayer</b><label>Ваше имя<input id="netname" maxlength="22" value="Лесоруб"></label><label>Режим<select id="netmode"><option value="direct">Прямой WebSocket</option><option value="host">Создать P2P-комнату (прокси)</option><option value="guest">Присоединиться к P2P-комнате</option></select></label><label>Имя/ID комнаты<input id="peerroom" placeholder="ID хоста для подключения" value=""></label><label><input id="peercustom" type="checkbox" style="width:auto"> Собственный PeerServer</label><div id="peersettings" style="display:none"><label>PeerServer host<input id="peerhost" value="localhost"></label><label>Port<input id="peerport" type="number" value="9000"></label><label>Path<input id="peerpath" value="/"></label><label><input id="peersecure" type="checkbox" style="width:auto"> HTTPS/WSS</label></div><label>WebSocket адрес сервера<input id="neturl" placeholder="ws://192.168.1.10:8765" value="ws://localhost:8765"></label><button id="connect">Подключиться</button> <button id="disconnect">Отключиться</button><small id="netstatus">Одиночный режим. Для HTTPS-страницы используйте wss://.</small></div><button id="reset" class="control">↻ Новый лес</button><div id="load"><div style="font-size:54px">🌲</div><b>FOREST CHOPPER 3D · BUILD</b><span>Загрузка 3D-движка...</span></div></div><script type="module" src="./src/main.js"></script></body></html>
